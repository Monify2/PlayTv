name: PlayTv Android Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Android platform
        run: flutter create --platforms=android --project-name playtv .

      - name: Set PlayTv Android app name
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = re.sub(
              r'android:label="[^"]*"',
              'android:label="PlayTv"',
              text,
              count=1,
          )
          manifest.write_text(text)

          strings = Path("android/app/src/main/res/values/strings.xml")
          if strings.exists():
              text = strings.read_text()
              pattern = r'<string name="app_name">.*?</string>'

              if re.search(pattern, text):
                  text = re.sub(
                      pattern,
                      '<string name="app_name">PlayTv</string>',
                      text,
                      count=1,
                  )
              else:
                  text = text.replace(
                      "</resources>",
                      '    <string name="app_name">PlayTv</string>\n</resources>',
                  )

              strings.write_text(text)
          PY

      - name: Remove tests
        run: rm -rf test

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Get dependencies
        run: flutter pub get

      - name: Verify backend configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}
        run: |
          test -n "$SUPABASE_URL" || (echo "SUPABASE_URL is EMPTY" && exit 1)
          test -n "$SUPABASE_PUBLISHABLE_KEY" || (echo "SUPABASE_PUBLISHABLE_KEY is EMPTY" && exit 1)
          test -n "$TMDB_API_KEY" || (echo "TMDB_API_KEY is EMPTY" && exit 1)
          echo "Supabase configuration is present"
          echo "TMDB configuration is present"

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="${SUPABASE_URL}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY}"

      - name: Rename release APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/PlayTv-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTv-release-apk
          path: build/app/outputs/flutter-apk/PlayTv-release.apk

      - name: Create GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: playtv-build-${{ github.run_number }}
          name: PlayTv Build ${{ github.run_number }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/PlayTv-release.apk
